[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-enhancement-pack"
version = "0.1.0"
description = "Prepare truthful publication JPEG copies with gentle enhancement and XMP context"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
photo-enhance = "photo_enhancement_pack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
